# The peerline service layer: a composable `Service`, a multi-transport `Host`,
# and the contract vocabulary a host speaks to take part in a cluster.
#
# The protocol itself — wire envelopes, the peer runtime and the WS / UDS /
# iroh transports — lives in the `peerline` repository, and the cluster layer
# built on this one — the coordinator and the supervisor — lives in
# `peerline-cluster`. The dependency arrow only ever runs
# `peerline-cluster` → `peerline-host` → `peerline`; nothing here is depended
# on by peerline, and nothing here depends on peerline-cluster.
[workspace]
members = [
    "crates/peerline-contract",
    "crates/peerline-contract-macros",
    "crates/peerline-contract-spec",
    "crates/peerline-host",
]
resolver = "2"

[workspace.package]
version = "0.0.7"
edition = "2024"
license = "MIT"
repository = "https://github.com/h-bar/peerline-host"

# Every dependency on a sibling repo or workspace member is declared with both
# a path and a version: the path is what a workspace build uses, the version is
# what `cargo package` writes into the published manifest. A path dependency
# without a version cannot be packaged at all.
[workspace.dependencies]
# The sibling protocol repo, checked out alongside this one.
peerline = { path = "../peerline/crates/peerline", version = "0.0.7", features = ["runtime"] }
peerline-transport-ws = { path = "../peerline/crates/peerline-transport-ws", version = "0.0.7" }
peerline-transport-uds = { path = "../peerline/crates/peerline-transport-uds", version = "0.0.7" }
peerline-transport-iroh = { path = "../peerline/crates/peerline-transport-iroh", version = "0.0.7" }
# Workspace members, same pattern.
peerline-contract = { path = "crates/peerline-contract", version = "0.0.7" }
peerline-contract-macros = { path = "crates/peerline-contract-macros", version = "0.0.7" }
peerline-contract-spec = { path = "crates/peerline-contract-spec", version = "0.0.7" }
peerline-host = { path = "crates/peerline-host", version = "0.0.7" }
