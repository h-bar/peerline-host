[package]
name = "peerline-manager"
description = "A live registry of the peerline services running on a host — itself a peerline service. Hosts register their dial coordinates over peerline and heartbeat to stay live (TTL-expired otherwise); clients query `manager.list` / `manager.lookup`. Reachable over any transport the host mounts it on. Ships a web dashboard and a `peerline-mon` CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# A daemon + CLI, installed from a checkout via `just install` — not a
# library for crates.io.
publish = false

# The manager daemon (also serves the web dashboard).
[[bin]]
name = "peerline-manager"
path = "src/main.rs"

# A terminal frontend that lists/watches the registry.
[[bin]]
name = "peerline-mon"
path = "src/bin/peerline-mon.rs"

[dependencies]
peerline = { workspace = true }
peerline-manager-protocol = { workspace = true }
serde_json = "1"
tracing = "0.1"
# The daemon runs the Manager on a Host over uds (+ optional ws for browsers).
# Inline (not `workspace = true`) because this is the one consumer that turns
# default features off, which cargo ignores on a workspace-inherited dep.
peerline-host = { path = "../peerline-host", version = "0.0.7", default-features = false, features = ["uds", "ws"] }
# Dial transports for the `peerline-mon` CLI client.
peerline-transport-uds = { workspace = true }
peerline-transport-ws = { workspace = true }
# Serves the web dashboard (static page) from the manager binary.
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
futures = "0.3"
