[package]
name = "peerline-contract-ts"
description = "The TypeScript generator for peerline contract manifests: turns a contracts directory into `.ts` declarations — interfaces, string-literal unions, discriminated unions and the manifest's own prose as doc comments — without a Rust mirror type or a derive in between. Library and `peerline-contract-ts` binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rpc", "peer-to-peer", "contract", "typescript", "peerline"]
categories = ["network-programming", "development-tools"]

[[bin]]
name = "peerline-contract-ts"
path = "src/main.rs"

[dependencies]
# The manifest format. This crate reads a validated `Manifest` and writes
# TypeScript; every rule about what a manifest may say is already enforced
# there, which is what lets the emitter match exhaustively and panic nowhere.
peerline-contract-spec = { workspace = true }
# A field default is arbitrary JSON, and it is rendered into a doc comment as
# the JSON a caller would have written.
serde_json = "1"
