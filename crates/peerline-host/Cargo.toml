[package]
name = "peerline-host"
description = "Unified multi-service host for peerline — register several `Service`s and serve them all from one binary over WS / UDS / iroh, each mounted under its own name (WS path, UDS socket, iroh ALPN) so their ops never collide. Replaces the per-service `serve` + transport fan-out + shutdown boilerplate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rpc", "peer-to-peer", "service", "transport", "peerline"]
categories = ["network-programming", "asynchronous"]

[features]
# All transports on by default; a consumer that only serves some can opt
# out (e.g. a WS+UDS daemon skips the heavy iroh/QUIC stack with
# `default-features = false, features = ["ws", "uds"]`).
default = ["ws", "uds", "iroh"]
ws = ["dep:peerline-transport-ws"]
uds = ["dep:peerline-transport-uds"]
iroh = ["dep:peerline-transport-iroh"]

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
tracing = "0.1"
peerline = { workspace = true }
# The cluster control path: what a service produces and consumes, the `coord.*`
# wire it speaks to a coordinator, and the manifest envelope it writes when
# probed. Types only — the coordinator's implementation is somewhere else.
peerline-contract = { workspace = true }
peerline-transport-ws = { workspace = true, optional = true }
peerline-transport-uds = { workspace = true, optional = true }
peerline-transport-iroh = { workspace = true, optional = true }

[dev-dependencies]
# `process` is for the signal tests: `Host::run`'s SIGTERM handling and
# `coordinator_from_env` are both properties of a real process, and the only
# way to observe either is to spawn one, signal it and read its exit status.
tokio = { version = "1", features = ["macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
peerline-transport-ws = { workspace = true }
# No dev-dependency on a coordinator. The end-to-end tests that needed a real
# one — register, resolve, restart, the transport matrix, the signal battery —
# live in `peerline-cluster`'s `peerline-coordinator` crate now, on the side of
# the arrow that already depends on this one. What is left here is what a host
# is on its own: mount resolution, shutdown, iroh key persistence, and the
# manifest it writes when probed.
